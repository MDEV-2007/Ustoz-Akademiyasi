# ==============================================================================
# Nginx Virtual Host for Ustoz Akademiyasi Backend (NestJS API)
# Domain: ustozakademiyasi-back.duckdns.org -> Docker: 127.0.0.1:4005
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ustozakademiyasi-back.duckdns.org;

    # Maximum file upload size (teachers, media, syllabus)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;

        # WebSocket & SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer requests (seeds, exports)
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Ustoz Akademiyasi Avatar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 800px;
      height: 800px;
      overflow: hidden;
      background: #021B13;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient background gradient */
    .bg-canvas {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #073F31 0%, #03281E 60%, #01140E 100%);
    }

    /* Circular border for Telegram circular crop guide */
    .circle-guide {
      position: absolute;
      width: 740px;
      height: 740px;
      border-radius: 50%;
      border: 2px solid rgba(0, 229, 153, 0.25);
      box-shadow: inset 0 0 40px rgba(0, 229, 153, 0.08);
    }
    .inner-circle-guide {
      position: absolute;
      width: 710px;
      height: 710px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.12);
    }

    /* Radiant glow */
    .glow-aura {
      position: absolute;
      width: 480px;
      height: 480px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      background: radial-gradient(circle, rgba(0, 229, 153, 0.28) 0%, rgba(7, 150, 111, 0.12) 50%, transparent 75%);
      border-radius: 50%;
    }

    .content-box {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .shield-wrapper {
      position: relative;
      filter: drop-shadow(0 20px 38px rgba(0, 229, 153, 0.35)) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7));
      margin-bottom: 28px;
    }

    .brand-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #FFFFFF;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .brand-title .emerald {
      color: #00E599;
    }
    .brand-sub {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #A3E9D0;
    }
  </style>
</head>
<body>
  <div class="bg-canvas"></div>
  <div class="circle-guide"></div>
  <div class="inner-circle-guide"></div>
  <div class="glow-aura"></div>

  <div class="content-box">
    <!-- Official Brand Shield from site -->
    <div class="shield-wrapper">
      <svg width="220" height="238" viewBox="0 0 100 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="shieldBaseGrad" x1="50" y1="6" x2="50" y2="102" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#00E599" />
            <stop offset="42%" stopColor="#059E6B" />
            <stop offset="100%" stopColor="#023826" />
          </linearGradient>
          <linearGradient id="shieldMidGrad" x1="50" y1="20" x2="50" y2="102" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#07966F" />
            <stop offset="100%" stopColor="#042C1E" />
          </linearGradient>
          <linearGradient id="shieldBotGrad" x1="50" y1="50" x2="50" y2="102" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#0A7758" />
            <stop offset="100%" stopColor="#021E14" />
          </linearGradient>
          <linearGradient id="shieldRaysGrad" x1="50" y1="18" x2="50" y2="76" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stopColor="#FFFFFF" />
            <stop offset="65%" stopColor="#E6FAF1" />
            <stop offset="100%" stopColor="#B3F3D5" />
          </linearGradient>
        </defs>

        <!-- Top Bright Emerald Shield Base -->
        <path d="M6 6H94V52C94 81 50 102 50 102C50 102 6 81 6 52V6Z" fill="url(#shieldBaseGrad)" />
        <!-- Middle Curved Band -->
        <path d="M6 34C26 14 74 14 94 34V52C94 81 50 102 50 102C50 102 6 81 6 52V34Z" fill="url(#shieldMidGrad)" />
        <!-- Bottom Deep Forest Arc -->
        <path d="M11 66C32 51 68 51 89 66C81 86 50 102 50 102C50 102 19 86 11 66Z" fill="url(#shieldBotGrad)" />
        <!-- Inner Glass Contour -->
        <path d="M8 8H92V51C92 78.5 50 98.5 50 98.5C50 98.5 8 78.5 8 51V8Z" stroke="rgba(255,255,255,0.35)" stroke-width="1.8" />
        <!-- Sun Rays ("Zulmatlardan Nur tomon") -->
        <g stroke="url(#shieldRaysGrad)" stroke-width="4.8" stroke-linecap="round">
          <line x1="50" y1="43" x2="50" y2="20" />
          <line x1="42" y1="45" x2="31" y2="25" />
          <line x1="36" y1="50" x2="19" y2="36" />
          <line x1="58" y1="45" x2="69" y2="25" />
          <line x1="64" y1="50" x2="81" y2="36" />
          <line x1="20" y1="54" x2="41" y2="54" />
          <line x1="59" y1="54" x2="80" y2="54" />
        </g>
        <!-- Central Book Peak -->
        <path d="M41 54L50 46L59 54" stroke="url(#shieldRaysGrad)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Open Book Curve -->
        <path d="M23 63C23 69 32 69 44 69C48 69 50 72 50 74.5C50 72 52 69 56 69C68 69 77 69 77 63" stroke="url(#shieldRaysGrad)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <!-- Brand Name -->
    <div class="brand-title">
      USTOZ <span class="emerald">AKADEMIYASI</span>
    </div>
    <div class="brand-sub">
      Arab tili ta’limi
    </div>
  </div>
</body>
</html>
